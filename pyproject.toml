[project]
name = "job-search-local"
version = "0.1.0"
description = "Local-first job discovery, scoring, and human-in-the-loop application workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlmodel>=0.0.22",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "streamlit>=1.36.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
